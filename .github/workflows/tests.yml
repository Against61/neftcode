name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-agent.txt
      - run: >-
          python -m unittest -v
          test_agent_tool
          test_decision_cycle
          test_expert_contracts
          test_scenario_sensitivity
          test_history_adapter
          test_operator_console
      - run: python scripts/check_agent_protocol.py --output /tmp/neft-protocol
      - run: python scripts/check_agent_raw_protocol.py --output /tmp/neft-raw-protocol
      - run: python scripts/check_history_protocol.py --output /tmp/neft-history-protocol
