name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-agent.txt
            requirements-cycle.txt
      - run: python -m pip install -r requirements-agent.txt
      - run: >-
          python -m unittest -v
          test_agent_tool
          test_decision_cycle
          test_expert_contracts
          test_scenario_sensitivity
          test_history_adapter
          test_operator_console
          test_runtime_v5
          test_action_outcome
          test_action_data_intake
          test_action_pipeline
          test_action_collection
      - run: python scripts/check_agent_protocol.py --output /tmp/neft-protocol
      - run: python scripts/check_agent_raw_protocol.py --output /tmp/neft-raw-protocol
      - run: python scripts/check_history_protocol.py --output /tmp/neft-history-protocol
      - name: Generated-fixture doctor and live HTTP smoke
        run: python scripts/check_runtime_smoke.py
